[package]
name = "market-consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
redis = { version = "1.7.0", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }