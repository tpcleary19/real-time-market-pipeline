[package]
name = "query-api"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
axum = "0.8.9"
tower-http = { version = "0.7", features = ["cors"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "tls-rustls-ring-native-roots"] }
tokio = { version = "1.53.1", features = ["full"] }

chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
